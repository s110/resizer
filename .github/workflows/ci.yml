name: CI

# push covers the default branch; pull_request covers feature branches —
# this avoids running the whole matrix twice for every PR push.
on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-14 # Apple Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: cargo test --all-targets
      - run: cargo build --release

  ui:
    name: interface tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: cargo build --release --bin resizer

      # `npx playwright` without a pinned version fetches @latest, whose
      # Chromium revision drifts from the pinned playwright-core the tests
      # import. Use the locally installed, pinned copy instead.
      - name: Install browser
        working-directory: tests/ui
        run: |
          npm install --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium

      # Covers the ffmpeg setup screen, the enlarged previews, and the A/B
      # overlay comparison — behaviour that only exists in the page.
      - name: Run interface tests
        working-directory: tests/ui
        run: node ui-test.mjs ../../target/release/resizer
